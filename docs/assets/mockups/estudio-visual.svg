idth="226" height="44" rx="10" fill="#F1F5F9"/><text x="1200" y="121" font-family="Arial, sans-serif" font-size="15" fill="#475569" font-weight="700">LLM: desactivada  ○</text></g><g id="comparacion" inkscape:groupmode="layer" inkscape:label="comparacion"><rect x="24" y="164" width="900" height="322" rx="10" fill="#FFFFFF"/><text x="48" y="203" font-family="Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700">Comparar modelos</text><text x="48" y="231" font-family="Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">2 corridas seleccionadas · Misma fuente, etiquetas y métricas</text><rect x="48" y="250" width="375" height="28" rx="10" fill="#FEF3C7"/><text x="60" y="270" font-family="Arial, sans-serif" font-size="13" fill="#92400E" font-weight="400">Métricas de entrenamiento · Menor MSE es mejor</text><rect x="48" y="295" width="850" height="38" rx="10" fill="#F1F5F9"/><text x="64" y="320" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="600">Modelo / ejecución</text><text x="410" y="320" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" font-weight="400">MAE</text><text x="540" y="320" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" font-weight="400">MSE ↓</text><text x="674" y="320" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" font-weight="400">Acciones</text><rect x="48" y="345" width="850" height="50" rx="10" fill="#DBEAFE"/><text x="64" y="376" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="600">Media · demo-003</text><text x="410" y="376" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">1,333</text><text x="540" y="376" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">2,667</text><text x="674" y="376" font-family="Arial, sans-serif" font-size="15" fill="#1D4ED8" font-weight="400">Abrir modelo</text><text x="64" y="432" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">Constante · demo-002</text><text x="410" y="432" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">3,000</text><text x="540" y="432" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">11,667</text><text x="674" y="432" font-family="Arial, sans-serif" font-size="15" fill="#1D4ED8" font-weight="400">Ver predicciones</text><text x="48" y="469" font-family="Arial, sans-serif" font-size="14" fill="#1D4ED8" font-weight="400">Guardar comparación  ·  Inspeccionar diferencias de configuración</text></g><g id="etiquetas" inkscape:groupmode="layer" inkscape:label="etiquetas"><rect x="24" y="510" width="900" height="344" rx="10" fill="#FFFFFF"/><text x="48" y="550" font-family="Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700">Asistencia de etiquetas</text><text x="48" y="580" font-family="Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">Funciona con reglas y modelos, incluso con el LLM apagado.</text><rect x="48" y="605" width="850" height="40" rx="10" fill="#F1F5F9"/><text x="64" y="631" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="600">Elemento</text><text x="244" y="631" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" font-weight="400">Etiqueta actual</text><text x="429" y="631" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" font-weight="400">Sugerencia / origen</text><text x="694" y="631" font-family="Arial, sans-serif" font-size="14" fill="#0F172A" font-weight="400">Revisión</text><text x="64" y="682" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">Muestra 018</text><text x="244" y="682" font-family="Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">Sin etiqueta</text><text x="429" y="682" font-family="Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="400">Clase B · Modelo auxiliar</text><text x="694" y="682" font-family="Arial, sans-serif" font-size="15" fill="#92400E" font-weight="400">Pendiente</text><rect x="48" y="714" width="152" height="44" rx="10" fill="#1D4ED8"/><text x="68" y="742" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">Aceptar</text><rect x="216" y="714" width="130" height="44" rx="10" fill="#F1F5F9"/><text x="236" y="742" font-family="Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="400">Editar</text><rect x="362" y="714" width="130" height="44" rx="10" fill="#F1F5F9"/><text x="382" y="742" font-family="Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="400">Rechazar</text><text x="48" y="796" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">Las propuestas no reemplazan automáticamente las etiquetas humanas.</text><text x="48" y="825" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">Aceptar crea una versión nueva; los resultados anteriores se conservan.</text></g><g id="recuperacion" inkscape:groupmode="layer" inkscape:label="recuperacion"><rect x="948" y="164" width="468" height="344" rx="10" fill="#FFFFFF"/><text x="972" y="203" font-family="Arial, sans-serif" font-size="22" fill="#0F172A" font-weight="700">Estados del estudio visual</text><text x="972" y="234" font-family="Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">Recuperá vistas, selección y referencias.</text><rect x="972" y="260" width="420" height="73" rx="10" fill="#DBEAFE"/><text x="988" y="289" font-family="Arial, sans-serif" font-size="17" fill="#0F172A" font-weight="600">Estado actual · Revisión 7</text><text x="988" y="314" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">Comparación y etiquetas en revisión</text><rect x="972" y="347" width="420" height="73" rx="10" fill="#F8FAFC"/><text x="988" y="376" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">Antes de revisar etiquetas · Revisión 6</text><text x="988" y="402" font-family="Arial, sans-serif" font-size="14" fill="#1D4ED8" font-weight="400">Ver diferencias     Recuperar</text><text x="972" y="454" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">Restaurar conserva el historial.</text><text x="972" y="479" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">Reanudar entrenamiento requiere un checkpoint.</text></g><g id="asistente" inkscape:groupmode="layer" inkscape:label="asistente"><rect x="948" y="530" width="468" height="324" rx="10" fill="#FFFFFF"/><text x="972" y="570" font-family="Arial, sans-serif" font-size="22" fill="#0F172A" font-weight="700">Asistente LLM</text><rect x="972" y="590" width="158" height="28" rx="10" fill="#F1F5F9"/><text x="984" y="610" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="600">○ Desactivado</text><text x="972" y="652" font-family="Arial, sans-serif" font-size="16" fill="#0F172A" font-weight="400">Explicar · Comparar · Sugerir etiquetas</text><text x="972" y="683" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">Elegí proveedor y contexto antes de enviar.</text><text x="972" y="709" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">Las propuestas requieren tu revisión.</text><rect x="972" y="732" width="420" height="44" rx="10" fill="#1D4ED8"/><text x="988" y="760" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">Configurar y activar asistencia</text><text x="972" y="816" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">La edición manual siempre está disponible.</text></g></svg>
