<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">STORM Studio · Configuración</title><desc id="desc">Mockup editable de STORM Studio. Contenido ficticio; no es una aplicación funcional. Textos y formas vectoriales editables.</desc><g id="01 · Fondo" inkscape:groupmode="layer" inkscape:label="01 · Fondo"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F8FAFC" stroke="none"/></g><g id="02 · Navegación" inkscape:groupmode="layer" inkscape:label="02 · Navegación"><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FFFFFF" stroke="none"/><rect x="26" y="22" width="36" height="36" rx="10" fill="#1D4ED8" stroke="none"/><text x="35" y="47" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">S</text><text x="76" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">STORM</text><text x="168" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Studio</text><text x="284" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">/  Laboratorio demo</text><text x="30" y="113" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Proyectos / Ejemplo numérico / Configurar estudio</text><text x="1130" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Entorno local</text><rect x="1260" y="25" width="150" height="28" rx="14" fill="#F1F5F9" stroke="none"/><text x="1272" y="44" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">DISEÑO PROPUESTO</text></g><g id="03 · Cabecera" inkscape:groupmode="layer" inkscape:label="03 · Cabecera"><text x="32" y="172" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Configurá el estudio</text><text x="32" y="203" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Elegí modelos y métricas. Cada campo incluye su ayuda.</text><rect x="1218" y="151" width="198" height="44" rx="8" fill="#1D4ED8" stroke="none"/><text x="1234" y="179" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Guardar cambios</text></g><g id="04 · Lista accesible" inkscape:groupmode="layer" inkscape:label="04 · Lista accesible"><rect x="24" y="236" width="328" height="618" rx="12" fill="#FFFFFF" stroke="none"/><text x="48" y="276" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Proceso en orden</text><text x="48" y="306" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Alternativa al lienzo</text><rect x="44" y="332" width="288" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/><text x="60" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">01  Datos demo</text><rect x="44" y="418" width="288" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/><text x="60" y="458" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">02  Escalar valores</text><rect x="44" y="504" width="288" height="68" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/><text x="60" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">03  Estudio</text><rect x="44" y="590" width="288" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/><text x="60" y="630" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">04  Resultados</text><rect x="44" y="728" width="288" height="44" rx="8" fill="#FFFFFF" stroke="#64748B"/><text x="60" y="756" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A">+ Agregar paso</text><text x="48" y="821" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">Reordenar con botones o teclado</text></g><g id="05 · Formulario" inkscape:groupmode="layer" inkscape:label="05 · Formulario"><rect x="376" y="236" width="708" height="618" rx="12" fill="#FFFFFF" stroke="none"/><text x="400" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Modelos a comparar</text><text x="400" y="307" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Se creará una corrida por configuración.</text><rect x="400" y="330" width="660" height="72" rx="8" fill="#EDE9FE" stroke="none"/><text x="418" y="359" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#0F172A">✓  Constante</text><text x="418" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Repite un valor para cada registro</text><text x="400" y="438" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Valor constante</text><rect x="400" y="453" width="300" height="46" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="416" y="483" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#0F172A">0</text><rect x="400" y="524" width="660" height="72" rx="8" fill="#EDE9FE" stroke="none"/><text x="418" y="553" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#0F172A">✓  Regresor de media</text><text x="418" y="577" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Aprende la media de los objetivos</text><text x="400" y="635" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#0F172A">Métricas</text><rect x="400" y="654" width="120" height="28" rx="14" fill="#FEF3C7" stroke="none"/><text x="412" y="673" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#92400E">✓ MAE</text><rect x="536" y="654" width="120" height="28" rx="14" fill="#FEF3C7" stroke="none"/><text x="548" y="673" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#92400E">✓ MSE</text><text x="400" y="722" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Semilla</text><rect x="400" y="737" width="300" height="46" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="416" y="767" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#0F172A">0</text><text x="400" y="823" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">Los campos se construyen desde el descriptor del componente.</text></g><g id="06 · Ayuda contextual" inkscape:groupmode="layer" inkscape:label="06 · Ayuda contextual"><rect x="1108" y="236" width="308" height="618" rx="12" fill="#FFFFFF" stroke="none"/><text x="1132" y="277" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Antes de ejecutar</text><rect x="1132" y="300" width="166" height="28" rx="14" fill="#DCFCE7" stroke="none"/><text x="1144" y="319" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#166534">✓ Datos compatibles</text><text x="1132" y="364" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">Objetivos disponibles</text><text x="1132" y="394" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">MAE y MSE necesitan</text><text x="1132" y="418" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">predicciones y objetivos.</text><rect x="1132" y="450" width="260" height="128" rx="8" fill="#FEF3C7" stroke="none"/><text x="1148" y="479" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#92400E">Sobre estas métricas</text><text x="1148" y="506" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#92400E">Se calculan sobre datos</text><text x="1148" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#92400E">de entrenamiento, no de</text><text x="1148" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#92400E">validación independiente.</text><text x="1132" y="627" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">Componentes de STORM</text><text x="1132" y="656" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Los plugins pueden agregar</text><text x="1132" y="680" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">modelos y formularios propios.</text><rect x="1132" y="732" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#64748B"/><text x="1148" y="760" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Ver ayuda del estudio</text></g></svg>
