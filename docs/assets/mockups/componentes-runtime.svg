<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">STORM Studio: catálogo de modelos, conectores y asistentes de integración</title>
  <desc id="desc">Mockup editable con modelos registrados, conectores de datos y un asistente para crear adapters.</desc>
  <g id="fondo" inkscape:groupmode="layer" inkscape:label="Fondo">
    <rect width="1440" height="900" fill="#F8FAFC"/>
  </g>
  <g id="navegacion" inkscape:groupmode="layer" inkscape:label="Navegación">
    <rect width="1440" height="80" fill="#FFFFFF"/>
    <rect x="28" y="22" width="36" height="36" rx="10" fill="#1D4ED8"/>
    <text x="38" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">S</text>
    <text x="78" y="48" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F172A">STORM</text>
    <text x="170" y="48" font-family="Arial, sans-serif" font-size="23" fill="#475569">Studio</text>
    <text x="287" y="48" font-family="Arial, sans-serif" font-size="16" fill="#475569">/ Componentes y runtime</text>
    <rect x="1238" y="24" width="176" height="30" rx="15" fill="#DCFCE7"/>
    <text x="1253" y="44" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">RUNTIME DISPONIBLE</text>
  </g>
  <g id="catalogo" inkscape:groupmode="layer" inkscape:label="Catálogo">
    <rect x="24" y="120" width="240" height="734" rx="12" fill="#FFFFFF"/>
    <text x="48" y="162" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Catálogo</text>
    <text x="48" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1D4ED8">Modelos</text>
    <rect x="40" y="218" width="208" height="50" rx="8" fill="#DBEAFE"/>
    <text x="56" y="249" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Registrados</text>
    <text x="48" y="306" font-family="Arial, sans-serif" font-size="15" fill="#475569">Conectores de datos</text>
    <text x="48" y="354" font-family="Arial, sans-serif" font-size="15" fill="#475569">Pasos</text>
    <text x="48" y="402" font-family="Arial, sans-serif" font-size="15" fill="#475569">Métricas</text>
    <text x="48" y="450" font-family="Arial, sans-serif" font-size="15" fill="#475569">Visualizadores</text>
    <rect x="40" y="742" width="208" height="48" rx="8" fill="#1D4ED8"/>
    <text x="58" y="772" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">+ Crear integración</text>
    <text x="48" y="823" font-family="Arial, sans-serif" font-size="13" fill="#475569">Solo paquetes habilitados</text>
  </g>
  <g id="modelos-registrados" inkscape:groupmode="layer" inkscape:label="Modelos registrados">
    <text x="300" y="162" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Modelos registrados</text>
    <text x="300" y="192" font-family="Arial, sans-serif" font-size="15" fill="#475569">Builders disponibles para ModelRegistry en este runtime.</text>
    <rect x="300" y="224" width="610" height="310" rx="12" fill="#FFFFFF"/>
    <rect x="320" y="252" width="570" height="40" rx="6" fill="#F1F5F9"/>
    <text x="336" y="278" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">TIPO / BUILDER</text>
    <text x="596" y="278" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">RUNTIME</text>
    <text x="752" y="278" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">ACCIÓN</text>
    <rect x="320" y="302" width="570" height="57" rx="6" fill="#DBEAFE"/>
    <text x="336" y="327" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">rainstorm.vame</text>
    <text x="336" y="347" font-family="Arial, sans-serif" font-size="12" fill="#475569">VAMEAdapter · config JSON</text>
    <text x="596" y="334" font-family="Arial, sans-serif" font-size="14" fill="#166534">Disponible</text>
    <text x="752" y="334" font-family="Arial, sans-serif" font-size="14" fill="#1D4ED8">Usar  ·  Ver adapter</text>
    <text x="336" y="396" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">mean_regressor</text>
    <text x="336" y="416" font-family="Arial, sans-serif" font-size="12" fill="#475569">storm.testing · ejemplo</text>
    <text x="596" y="403" font-family="Arial, sans-serif" font-size="14" fill="#166534">Disponible</text>
    <text x="752" y="403" font-family="Arial, sans-serif" font-size="14" fill="#1D4ED8">Usar  ·  Ver schema</text>
    <text x="336" y="468" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">external.estimator</text>
    <text x="336" y="488" font-family="Arial, sans-serif" font-size="12" fill="#475569">Dependencia opcional ausente</text>
    <text x="596" y="475" font-family="Arial, sans-serif" font-size="14" fill="#92400E">Bloqueado</text>
    <text x="752" y="475" font-family="Arial, sans-serif" font-size="14" fill="#1D4ED8">Ver requisito</text>
  </g>
  <g id="asistente-adapter" inkscape:groupmode="layer" inkscape:label="Asistente de adapter">
    <rect x="934" y="120" width="482" height="414" rx="12" fill="#FFFFFF"/>
    <text x="960" y="162" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Crear adapter</text>
    <text x="960" y="190" font-family="Arial, sans-serif" font-size="14" fill="#475569">Asistente de integración · revisión humana requerida</text>
    <text x="960" y="237" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Clase o módulo</text>
    <rect x="960" y="248" width="426" height="42" rx="6" fill="#FFFFFF" stroke="#64748B"/>
    <text x="974" y="275" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">external_library.Estimator</text>
    <text x="960" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Contrato detectado</text>
    <rect x="960" y="338" width="426" height="58" rx="8" fill="#DCFCE7"/>
    <text x="976" y="363" font-family="Arial, sans-serif" font-size="14" fill="#166534">fit(inputs, targets) · predict(inputs)</text>
    <text x="976" y="383" font-family="Arial, sans-serif" font-size="12" fill="#166534">Falta normalizar la salida a ModelOutput</text>
    <rect x="960" y="422" width="190" height="42" rx="8" fill="#1D4ED8"/>
    <text x="978" y="448" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Generar borrador</text>
    <rect x="1164" y="422" width="222" height="42" rx="8" fill="#FFFFFF" stroke="#64748B"/>
    <text x="1180" y="448" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">Ver requisitos</text>
    <text x="960" y="503" font-family="Arial, sans-serif" font-size="13" fill="#475569">El asistente no instala, ejecuta ni registra código.</text>
  </g>
  <g id="conector-input" inkscape:groupmode="layer" inkscape:label="Creador de conector">
    <rect x="300" y="566" width="1116" height="288" rx="12" fill="#FFFFFF"/>
    <text x="326" y="607" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Cargar inputs · crear DataLoader</text>
    <text x="326" y="635" font-family="Arial, sans-serif" font-size="14" fill="#475569">DataRef → Dataset(inputs, targets, metadata) · prueba de muestra</text>
    <rect x="326" y="666" width="250" height="56" rx="8" fill="#DBEAFE"/>
    <text x="344" y="691" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">1  ORIGEN</text>
    <text x="344" y="710" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">Archivo / API / workspace</text>
    <rect x="596" y="666" width="250" height="56" rx="8" fill="#DCFCE7"/>
    <text x="614" y="691" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">2  MAPEO</text>
    <text x="614" y="710" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">inputs · targets · metadata</text>
    <rect x="866" y="666" width="250" height="56" rx="8" fill="#FEF3C7"/>
    <text x="884" y="691" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#92400E">3  VALIDACIÓN</text>
    <text x="884" y="710" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">fingerprint · muestra · schema</text>
    <rect x="1136" y="666" width="250" height="56" rx="8" fill="#F1F5F9"/>
    <text x="1154" y="691" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">4  REGISTRO</text>
    <text x="1154" y="710" font-family="Arial, sans-serif" font-size="14" fill="#0F172A">Revisión antes de activar</text>
    <text x="326" y="775" font-family="Arial, sans-serif" font-size="14" fill="#166534">✓ Muestra compatible · 3 registros · objetivos detectados</text>
    <text x="326" y="808" font-family="Arial, sans-serif" font-size="13" fill="#475569">RAINSTORM puede aportar DLC/pose/ROI en su plugin; STORM conserva solo el contrato del conector.</text>
  </g>
</svg>
