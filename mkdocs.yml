  - Studio:
      - Aplicación Django: guides/django-suite.md
      - Viabilidad y arquitectura: architecture/visual-studio.md
      - Marca y experiencia: design/studio-brand.md
      - Mockups editables: design/studio-mockups.md
      - Estudio visual y asistencia: design/visual-study.md
      - Plan vigente de cierre: planning/suite-completion.md
      - Plan histórico: planning/studio-roadmap.md
  - Observabilidad: observability.md
  - Guías:
      - Contextos y experimentos: guides/context-experiments.md
      - Estudios y corridas: guides/studies-and-runs.md
      - Modelos compatibles: guides/models.md
      - Métricas: guides/metrics.md
      - Artefactos y recuperación: guides/artifacts.md
      - Pipelines y pasos: guides/pipelines-and-steps.md
      - Visualizaciones: guides/visualizations.md
