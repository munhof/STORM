[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "storm-workspace"
version = "0.1.0a0"
description = "Domain-neutral framework for traceable and reproducible model studies"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
authors = [
    { name = "Facundo Munhó" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["storm-traceable", "storm-studio", "storm-studio-visual"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.9", "playwright>=1.50"]
docs = ["mkdocs>=1.6"]
examples = [
    "ipykernel>=6",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
storm-traceable = { workspace = true }
storm-studio = { workspace = true }
storm-studio-visual = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["packages/storm-engine/src", "packages/storm-studio/src", "packages/storm-visualization/src"]
testpaths = ["tests", "studio-visual/tests"]
DJANGO_SETTINGS_MODULE = "storm_studio.settings"
