<script>
window.StormModelGraph = {
  render(descriptor, value, id, update, renderValue) {
    const box = document.createElement('fieldset');
    box.style.gridColumn = '1 / -1';
    const legend = document.createElement('legend'); legend.textContent = 'Composición del modelo';
    const toggle = document.createElement('button'); toggle.type = 'button';
    const status = document.createElement('p'); status.setAttribute('aria-live', 'polite');
    const diagram = document.createElement('div'); diagram.style.overflowX = 'auto';
    const controls = document.createElement('div'); controls.className = 'grid';
    let active = Boolean(value && Array.isArray(value.nodes) && Array.isArray(value.edges));
    let graph = structuredClone(active ? value : descriptor.default);
    function draw() {
      diagram.replaceChildren(); controls.replaceChildren();
      toggle.textContent = active ? 'Usar campos de configuración' : 'Activar grafo';
      status.textContent = active ? 'Grafo activo. Guardar valida puertos, configuración y cableado.' :
        'Vista del modelo predeterminado. Activá el grafo para editar sus nodos.';
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      const rows = Math.ceil(graph.nodes.length / 3);
      svg.setAttribute('viewBox', `0 0 660 ${rows * 110}`);
      svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Grafo de arquitectura y entrenamiento');
      svg.setAttribute('data-model-graph', ''); svg.style.width = '100%'; svg.style.minWidth = '420px';
      const positions = Object.fromEntries(graph.nodes.map((node, index) =>
        [node.id, [20 + (index % 3) * 220, 15 + Math.floor(index / 3) * 110]]));
      for (const edge of graph.edges) {
        const source = positions[edge.source.split('.')[0]], target = positions[edge.target.split('.')[0]];
        if (!source || !target) continue;
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', source[0] + 90); line.setAttribute('y1', source[1] + 50);
        line.setAttribute('x2', target[0] + 90); line.setAttribute('y2', target[1]);
        line.setAttribute('stroke', '#7183a0'); svg.append(line);
      }
      for (const node of graph.nodes) {
        const [x, y] = positions[node.id];
        const rect = document.createElementNS(ns, 'rect');
        for (const [key, val] of Object.entries({x, y, width: 185, height: 50, rx: 8,
          fill: '#f4f8ff', stroke: '#1754ad'})) rect.setAttribute(key, val);
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', x + 10); text.setAttribute('y', y + 29); text.textContent = node.type;
        svg.append(rect, text);
        if (!active) continue;
        const card = document.createElement('section'); card.className = 'card';
        const label = document.createElement('label'); label.textContent = node.id;
        const select = document.createElement('select'); select.id = `${id}-${node.id}-type`;
        label.htmlFor = select.id;
        for (const kind of descriptor.slots[node.id] || []) {
          const option = document.createElement('option'); option.value = kind; option.textContent = kind;
          select.append(option);
        }
        select.value = node.type;
        select.addEventListener('change', () => {node.type = select.value; update(structuredClone(graph)); draw();});
        card.append(label, select);
        const schema = descriptor.nodes[node.type]?.schema;
        if (schema && Object.keys(schema.properties || {}).length) {
          card.append(renderValue('Parámetros', schema, node.config || {}, `${id}-${node.id}-config`, next => {
            node.config = next; update(structuredClone(graph));
          }));
        }
        controls.append(card);
      }
      diagram.append(svg);
    }
    toggle.addEventListener('click', () => {
      active = !active; update(active ? structuredClone(graph) : {}); draw();
    });
    box.append(legend, toggle, status, diagram, controls); draw(); return box;
  }
};
</script>
